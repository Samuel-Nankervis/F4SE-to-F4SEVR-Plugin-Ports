; Bullet Counted Reload System (BCR) - VR Configuration
; Controls reload interruption behavior for Fallout 4 VR

[VR]
; Enable VR reload interruption (1 = enabled, 0 = disabled)
bEnableVRInterrupt = 1

; Weapon Hand:
; 0 = Auto-detect (automatically matches Fallout 4 VR left-handed mode setting)
; 1 = Force Right Hand as weapon hand
; 2 = Force Left Hand as weapon hand
iWeaponHand = 0

; Controller Type:
; 0 = Auto-detect (Valve Index, Oculus/Quest Touch, PSVR2, Steam Frame, Vive Wand, WMR)
; 1 = Valve Index (Knuckles)
; 2 = Meta / Oculus Touch (Quest 1/2/3/Pro, Rift S)
; 3 = HTC Vive Wand
; 4 = PlayStation VR2 Sense
; 5 = Steam Frame
; 6 = Windows Mixed Reality
iControllerType = 0

; Buttons on the WEAPON HAND that interrupt a reload (1 = enabled, 0 = disabled):
; NOTE: All off-hand buttons (left hand for righties, right hand for lefties) are ALWAYS ignored.
;
; bInterruptOnTrigger: Weapon hand trigger pull or click (Fire button)
bInterruptOnTrigger = 1

; bInterruptOnReloadButton: Primary reload button on weapon hand
; - Valve Index / Oculus Touch / PSVR2 / Steam Frame / WMR: A button
; - HTC Vive Wand: Grip button
bInterruptOnReloadButton = 1

; Optional extra buttons on the weapon hand (disabled by default):
bInterruptOnGrip = 0
bInterruptOnTouchpad = 0
bInterruptOnAltButton = 0

; Trigger threshold sensitivity (0.10 to 0.90, default 0.50)
fTriggerThreshold = 0.50

; Verbose debug logging in BulletCountedReload.log (1 = log all animation events & raw inputs, 0 = quiet/performance mode)
bVerboseLogging = 0
